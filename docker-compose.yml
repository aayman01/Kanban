services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - kanban_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./kanban-back
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      PORT: "3010"
      DATABASE_URL: postgresql://kanban:kanban@db:5432/kanban
      ALLOWED_ORIGINS: http://localhost:3000
      # Local demo only — replace before any real deployment
      JWT_ACCESS_SECRET: docker-compose-local-access-secret-min-32
      JWT_REFRESH_SECRET: docker-compose-local-refresh-secret-min-32
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./kanban-front
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3010/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  kanban_pg:
